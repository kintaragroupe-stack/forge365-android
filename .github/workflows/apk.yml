# Fabrique l'APK de test de FORGE 365 sur les serveurs de GitHub, puis le dépose dans « Releases »
# (téléchargeable directement depuis le téléphone).
name: APK FORGE 365

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # clé de test (mot de passe public « android ») : créée au premier passage puis gardée dans le dépôt
      - name: Clé de test
        run: |
          if [ ! -f app/cle-test.keystore ]; then
            keytool -genkeypair -v -keystore app/cle-test.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FORGE 365 Test,O=FORGE 365,C=BF"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/cle-test.keystore
            git commit -m "Clé de test de l'APK [skip ci]"
            git push
          fi

      - name: Fabrication de l'APK
        run: gradle --no-daemon assembleDebug

      - name: Noms des fichiers
        run: |
          mkdir -p sortie
          cp app/build/outputs/apk/debug/*arm64-v8a*.apk sortie/FORGE365-test-${{ github.run_number }}-arm64.apk
          cp app/build/outputs/apk/debug/*armeabi-v7a*.apk sortie/FORGE365-test-${{ github.run_number }}-armv7.apk
          ls -la sortie

      - name: Dépôt dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: FORGE 365 — test ${{ github.run_number }}
          body: |
            APK de test. Sur le téléphone : téléchargez le fichier « arm64 » (presque tous les téléphones récents),
            ou « armv7 » si le premier refuse de s'installer.
          prerelease: true
          files: sortie/*.apk
