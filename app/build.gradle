plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'space.forge365.app'
    compileSdk 35

    defaultConfig {
        applicationId 'space.forge365.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.0.4'
    }

    buildFeatures { buildConfig true }

    // Clés de signature. « test » : clé de test Android ordinaire (mot de passe public « android »), créée une fois par
    // GitHub et gardée dans le dépôt pour pouvoir installer chaque nouvel APK de test par-dessus l'ancien.
    // « publication » : clé du Play Store, fournie seulement par les secrets GitHub (jamais dans le code).
    signingConfigs {
        test {
            storeFile file('cle-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        publication {
            def ks = System.getenv('F365_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('F365_KEYSTORE_MDP')
                keyAlias System.getenv('F365_CLE_ALIAS')
                keyPassword System.getenv('F365_CLE_MDP')
            }
        }
    }

    buildTypes {
        debug {
            if (file('cle-test.keystore').exists()) { signingConfig signingConfigs.test }
        }
        release {
            minifyEnabled false
            if (System.getenv('F365_KEYSTORE')) { signingConfig signingConfigs.publication }
        }
    }

    // un APK par type de processeur : fichier plus léger à télécharger sur le téléphone
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation('org.jitsi.react:jitsi-meet-sdk:13.3.3') { transitive = true }
}
